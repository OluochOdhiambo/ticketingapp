syntax = "proto3";

option csharp_namespace = "Contracts.Protos";

service OrderService {
	rpc BookTicket (BookTicketRequest) returns (BookTicketResponse);
	rpc AddOrderLine (AddOrderLineRequest) returns (AddOrderLineResponse);
	rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
	rpc GetPaginatedOrders (GetPaginatedOrdersRequest) returns (GetPaginatedOrdersResponse);
}

message CreateOrderItemModel {
	string ticketId = 1;
	int32 orderedQuantity = 2;
}

message OrderItemModel {
	string id = 1;
	string orderId = 2;
	string ticketId = 3;
	int32 orderedQuantity = 4;
	string currencyCode = 5;
	double unitPrice = 6;
	double lineTotal = 7;
}

message OrderModel {
	string id = 1;
	string customerId = 2;
	repeated OrderItemModel items = 3;
	double totalPrice = 4;
	string status = 5;
}

message BookTicketRequest {	
	string customerId = 1;
	CreateOrderItemModel orderLine = 2;
}

message BookTicketResponse {
	OrderModel order = 1;
}

message AddOrderLineRequest {
	string orderId = 1;
	CreateOrderItemModel orderLine = 2;
}

message AddOrderLineResponse {
	OrderModel order = 1;
}

message GetOrderRequest {
	string orderId = 1;
}

message GetOrderResponse {
	OrderModel order = 1;
}

message GetPaginatedOrdersRequest {
  int32 pageNumber = 1;
  int32 pageSize = 2;
}

message GetPaginatedOrdersResponse {
  repeated OrderModel orders = 1;

  int32 totalCount = 2;
  int32 pageNumber = 3;
  int32 pageSize = 4;
}